services:
  mysql:
    image: mysql:8.0
    container_name: ewallet-mysql
    command: --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      TZ: Asia/Jakarta
    depends_on:
      mysql:
        condition: service_healthy

  ewallet-be:
    build: ./ewallet-be
    container_name: ewallet-be
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wallet_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      USER_SERVICE_URL: http://user-service:8081
      TZ: Asia/Jakarta
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started

volumes:
  mysqldata:
